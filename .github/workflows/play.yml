name: Play bundles

# Builds the two Android App Bundles for Google Play (run by hand, not on a tag):
#   relay-receiver-<v>-play.aab     receiver, `play` flavor
#   relay-controller-<v>-play.aab   controller, built with RELAY_PLAY=1
#
# Both are the Play flavor: no GitHub updater, no REQUEST_INSTALL_PACKAGES
# (Google Play updates the app). Download them from the run's artifacts and
# upload them in the Play Console.
#
# Needs the real signing secrets (ANDROID_KEYSTORE_BASE64, ...): a throwaway key
# would make every bundle a different app as far as Play is concerned, so this
# workflow refuses to run without them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v0.9.0 (does not create a tag)'
        required: true

permissions:
  contents: read

env:
  RELAY_VERSION: ${{ github.event.inputs.tag }}

jobs:
  receiver:
    name: Receiver bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/receiver-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed bundle
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon test bundlePlayRelease \
            -PrelayVersion="$RELAY_VERSION" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/bundle/playRelease/*.aab "$GITHUB_WORKSPACE/out/relay-receiver-${RELAY_VERSION}-play.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-play
          path: out/*

  controller:
    name: Controller bundle
    runs-on: ubuntu-latest
    env:
      RELAY_PLAY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Generate native project (CNG)
        working-directory: apps/controller
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed bundle
        working-directory: apps/controller/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Play delivers per-device splits, so every ABI goes in the bundle.
        run: |
          ./gradlew --no-daemon bundleRelease \
            --init-script "$GITHUB_WORKSPACE/.github/gradle/skip-lint.init.gradle" \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/bundle/release/*.aab "$GITHUB_WORKSPACE/out/relay-controller-${RELAY_VERSION}-play.aab"
      # A bundle without its JavaScript installs fine and crashes on launch with
      # "Unable to load script"; refuse to publish one.
      - name: Verify the bundle contains the JS bundle
        run: unzip -l "out/relay-controller-${RELAY_VERSION}-play.aab" | grep -q 'base/assets/index.android.bundle'
      - uses: actions/upload-artifact@v4
        with:
          name: controller-play
          path: out/*
