name: Release

# Push a tag like v1.4.2 and every app is built and attached to a GitHub
# Release:
#   relay-receiver-<v>.apk     Android receiver (Kotlin)
#   relay-controller-<v>.apk   Android controller (Expo, prebuilt in CI)
#   relay-controller-<v>-unsigned.ipa   iOS controller, unsigned (re-sign to install)
#   relay-extension-<v>.zip    Chrome/Brave extension, load unpacked
#   skipper-chrome-web-store-<v>.zip  the same, for a Chrome Web Store upload
#   relay-server-<v>.tgz       relay server, built JS
#   ghcr.io/<owner>/slop-remote-relay-server:<v> and :latest   relay server image
#
# Publishing order: the release appears with its notes first, then the
# extension and relay server, then the APKs, then the iOS build, then checksums.
#
# Signing (optional but recommended — see docs/RELEASE.md):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the APKs are signed with a throwaway key generated for the run,
# which installs fine but cannot update an install signed by another run.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build, e.g. v0.2.0 (does not create a tag)'
        required: true

permissions:
  contents: write
  packages: write

env:
  RELAY_VERSION: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - run: npm run typecheck
      - run: npm test

  keystore:
    # One signing key for both Android apps in this run: the real one from
    # secrets, or a throwaway one when the secrets are not configured.
    name: Android signing key
    runs-on: ubuntu-latest
    outputs:
      throwaway: ${{ steps.key.outputs.throwaway }}
    steps:
      - id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "throwaway=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore release.jks -storepass throwaway -keypass throwaway \
              -alias relay -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Relay CI"
            echo "throwaway=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a throwaway key."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.jks
          retention-days: 1

  receiver:
    name: Android receiver
    needs: [checks, keystore]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/receiver-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: keystore
          path: ${{ runner.temp }}
      - name: Build signed release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'throwaway' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'relay' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'throwaway' }}
        run: |
          ./gradlew --no-daemon test assembleRelease \
            -PrelayVersion="$RELAY_VERSION" \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/relay-receiver-${RELAY_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: receiver
          path: out/*

  controller-android:
    name: Controller — Android
    needs: [checks, keystore]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Generate native project (CNG)
        working-directory: apps/controller
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
      # Read-only here: the Controller builds workflow on master fills it.
      - uses: ./.github/actions/ccache
        with:
          name: android
      - uses: actions/download-artifact@v4
        with:
          name: keystore
          path: ${{ runner.temp }}
      - name: Build signed release APK
        working-directory: apps/controller/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'throwaway' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'relay' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'throwaway' }}
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        # Phones only: leaving out the x86 ABIs roughly halves the APK.
        run: |
          ./gradlew --no-daemon --build-cache assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="${{ runner.temp }}/release.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/release/*.apk "$GITHUB_WORKSPACE/out/relay-controller-${RELAY_VERSION}.apk"
          ccache --show-stats
      - uses: actions/upload-artifact@v4
        with:
          name: controller-android
          path: out/*

  controller-ios:
    name: Controller — iOS (unsigned)
    needs: checks
    outputs:
      built: ${{ steps.archive.outcome == 'success' }}
    # Expo SDK 57 builds ExpoModulesJSI with Swift 6.2, i.e. Xcode 26.
    runs-on: macos-26
    # Signing an iOS build needs an Apple developer account; until one is set
    # up this produces an unsigned .ipa for re-signing tools. A failure here
    # must not block the Android and browser releases.
    continue-on-error: true
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      # Before prebuild: pod install wires ccache in only if it finds it.
      - uses: ./.github/actions/ccache
        with:
          name: ios
      - name: Generate native project (CNG)
        working-directory: apps/controller
        run: npx expo prebuild --platform ios --clean
        env:
          CI: '1'
          RELAY_CCACHE: '1'
      - name: Build unsigned archive
        id: archive
        working-directory: apps/controller/ios
        run: |
          xcodebuild -workspace Relay.xcworkspace -scheme Relay -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Relay.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p "$RUNNER_TEMP/Payload" "$GITHUB_WORKSPACE/out"
          cp -R "$RUNNER_TEMP/Relay.xcarchive/Products/Applications/Relay.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/out/relay-controller-${RELAY_VERSION}-unsigned.ipa" Payload)
          ccache --show-stats
      - name: App info for the AltStore source
        # AltStore requires a source to list every privacy string and
        # entitlement; read them from the built app so they cannot drift.
        run: |
          APP="$RUNNER_TEMP/Relay.xcarchive/Products/Applications/Relay.app"
          plutil -convert json -o "$RUNNER_TEMP/info.json" "$APP/Info.plist"
          ENT=apps/controller/ios/Relay/Relay.entitlements
          if [ -f "$ENT" ]; then plutil -convert json -o "$RUNNER_TEMP/ent.json" "$ENT"; else echo "{}" > "$RUNNER_TEMP/ent.json"; fi
          node -e "
            const info = require(process.env.RUNNER_TEMP + '/info.json');
            const ent = require(process.env.RUNNER_TEMP + '/ent.json');
            const privacy = Object.fromEntries(Object.entries(info).filter(([k]) => /^NS.*UsageDescription$/.test(k)));
            require('fs').writeFileSync('out/ios-info.json', JSON.stringify({
              tag: process.env.RELAY_VERSION, minOSVersion: info.MinimumOSVersion,
              privacy, entitlements: Object.keys(ent) }, null, 2));
          "
          cat out/ios-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: ios-info
          path: out/ios-info.json
      - run: rm out/ios-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: controller-ios
          path: out/*

  extension:
    name: Browser extension
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - working-directory: apps/browser-extension
        run: |
          node build.mjs --zip
          mkdir -p "$GITHUB_WORKSPACE/out"
          mv relay-extension-*.zip "$GITHUB_WORKSPACE/out/relay-extension-${RELAY_VERSION}.zip"
          node build.mjs --store
          mv skipper-chrome-web-store-*.zip "$GITHUB_WORKSPACE/out/skipper-chrome-web-store-${RELAY_VERSION}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/*

  relay:
    name: Relay server
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Build tarball
        working-directory: services/relay
        run: |
          npx tsc -p tsconfig.json
          mkdir -p "$GITHUB_WORKSPACE/out" stage
          cp -R dist package.json Dockerfile stage/
          tar -czf "$GITHUB_WORKSPACE/out/relay-server-${RELAY_VERSION}.tgz" -C stage .
      - uses: actions/upload-artifact@v4
        with:
          name: relay
          path: out/*
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/slop-remote-relay-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: services/relay
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.RELAY_VERSION }}
            ${{ steps.image.outputs.name }}:latest

  # ------------------------------------------------------------- publishing
  #
  # The release appears as soon as the checks pass, with its notes, and fills
  # up as builds finish, always in this order: extension (and relay server),
  # then the Android apps, then iOS, then checksums. Builds still run in
  # parallel; only the uploads are chained.

  notes:
    name: Publish — release notes
    needs: [checks, keystore]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Full history and tags: the notes list the commits since the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes
        # Commits since the previous tag, grouped by Conventional Commit type,
        # with .github/release-notes/<tag>.md on top when it exists.
        run: |
          node tools/release-notes.mjs "$RELAY_VERSION" ${{ needs.keystore.outputs.throwaway == 'true' && '--throwaway-key' || '' }} > notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create or update the release
        run: |
          if gh release view "$RELAY_VERSION" >/dev/null 2>&1; then
            gh release edit "$RELAY_VERSION" --title "Skipper $RELAY_VERSION" --notes-file notes.md
          else
            gh release create "$RELAY_VERSION" --verify-tag --title "Skipper $RELAY_VERSION" --notes-file notes.md
          fi

  publish-extension:
    name: Publish — extension and relay server
    needs: [notes, extension, relay]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          pattern: '{extension,relay}'
          merge-multiple: true
      - run: gh release upload "$RELAY_VERSION" files/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-android:
    name: Publish — Android apps
    needs: [publish-extension, receiver, controller-android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          pattern: '{receiver,controller-android}'
          merge-multiple: true
      - run: gh release upload "$RELAY_VERSION" files/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-ios:
    name: Publish — iOS
    needs: [publish-android, controller-ios]
    # The iOS build is allowed to fail; the release is complete without it.
    if: ${{ !cancelled() && needs.publish-android.result == 'success' && needs.controller-ios.outputs.built == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: controller-ios
          path: files
      - run: gh release upload "$RELAY_VERSION" files/* --clobber --repo "$GITHUB_REPOSITORY"

  checksums:
    name: Publish — checksums
    needs: [publish-android, publish-ios]
    if: ${{ !cancelled() && needs.publish-android.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: SHA256SUMS of everything published
        run: |
          mkdir files && cd files
          gh release download "$RELAY_VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'relay-*' --pattern 'skipper-*'
          sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
          gh release upload "$RELAY_VERSION" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

  altstore:
    # Publishes the AltStore / SideStore source to GitHub Pages, listing every
    # release that has an iOS build. Add it once in AltStore:
    #   https://<owner>.github.io/<repo>/altstore.json
    name: AltStore source
    needs: [publish-ios]
    if: ${{ !cancelled() && needs.publish-ios.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}altstore.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: ios-info
          path: ${{ runner.temp }}
      - name: Build source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/altstore-source.mjs site "${{ runner.temp }}/ios-info.json"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
