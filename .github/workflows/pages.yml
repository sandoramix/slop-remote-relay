name: Pages

# Publishes the project site in pages/ to GitHub Pages. A Pages deploy replaces
# the whole site, so this carries over altstore.json from the live site (it is
# rebuilt by release.yml, which in turn copies pages/ in).
on:
  push:
    branches: [master]
    paths: ['pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir site
          cp -r pages/. site/
          cp apps/controller/assets/images/icon.png site/icon.png
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$base/altstore.json" -o site/altstore.json || echo "no live altstore.json yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
