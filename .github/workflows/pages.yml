name: Pages

# Publishes the project site in pages/ to GitHub Pages, including the pairing
# landing page in pages/pair/ (the target of every receiver's QR code), without
# waiting for a release. A Pages deploy replaces the whole site, so this carries
# over altstore.json from the live site (it is rebuilt by release.yml, whose
# altstore job in turn copies all of pages/ in). Whichever deploys last
# therefore still serves the site, /pair/ and altstore.json.
on:
  push:
    branches: [master]
    paths: ['pages/**', 'tools/pages-fill.sh', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          CHROME_WEBSTORE_URL: ${{ vars.CHROME_WEBSTORE_URL }}
        run: |
          mkdir site
          cp -r pages/. site/
          test -f site/pair/index.html
          tools/pages-fill.sh site
          cp apps/controller/assets/images/icon.png site/icon.png
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          curl -fsSL "$base/altstore.json" -o site/altstore.json || echo "no live altstore.json yet"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
