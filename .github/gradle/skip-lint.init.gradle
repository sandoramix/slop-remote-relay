// Release builds do not need Android lint: `lintVital` re-analyses every
// native module on each run (about 200 s on a CI runner) and reports nothing
// the type checker and the tests did not. Applied with --init-script, since
// android/ is generated by `expo prebuild` and cannot be edited.
allprojects {
    tasks.configureEach { task ->
        if (task.name.toLowerCase().contains('lint')) {
            task.enabled = false
        }
    }
}
